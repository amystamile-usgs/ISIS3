<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Two overlapping rectangles (image alignment) -->
  <rect x="5" y="5" width="10" height="10" rx="1" fill="none" stroke="#aa66ff" stroke-width="1.5" opacity="0.5"/>
  <rect x="9" y="9" width="10" height="10" rx="1" fill="none" stroke="#aa66ff" stroke-width="1.5"/>

  <!-- Alignment crosshairs -->
  <line x1="10" y1="14" x2="18" y2="14" stroke="#aa66ff" stroke-width="1" opacity="0.7"/>
  <line x1="14" y1="10" x2="14" y2="18" stroke="#aa66ff" stroke-width="1" opacity="0.7"/>
  <circle cx="14" cy="14" r="1.5" fill="none" stroke="#aa66ff" stroke-width="1"/>
</svg>

  <circle cx="12" cy="8" r="3" fill="#4cafb4"/>
  <!-- Sun rays -->
  <line x1="12" y1="2" x2="12" y2="4" stroke="#4cafb4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="5" x2="15.5" y2="6.5" stroke="#4cafb4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="8" x2="17" y2="8" stroke="#4cafb4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="8" x2="5" y2="8" stroke="#4cafb4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="5" x2="8.5" y2="6.5" stroke="#4cafb4" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Shadow -->

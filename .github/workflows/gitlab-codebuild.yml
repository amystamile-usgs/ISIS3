name: Github to Gitlab CI - Run CodeBuild

env:
  PR_NUMBER: ${{ github.event.number }}

on:
  pull_request_target:
    branches: 
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Configure SSH Key for GitLab Access
        id: ssh_setup
        run: |
          # 1. Ensure .ssh directory exists
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 2. Write the single-line Base64 key to a temporary file (Prevents truncation error)
          printf "%s" "${{ secrets.GITLAB_SSH_PRIVATE_KEY }}" > /tmp/key_base64
          
          # 3. Decode the key from the file and write to id_rsa
          base64 --decode /tmp/key_base64 > ~/.ssh/id_rsa
          rm /tmp/key_base64 # Clean up temp file
          
          chmod 600 ~/.ssh/id_rsa
    
          # --- DEBUGGING OUTPUT (Check this to ensure key is complete) ---
          echo "--- START: Written Key Content ---"
          cat ~/.ssh/id_rsa
          echo "--- END: Written Key Content ---"
          # --------------------------------------------------
          
          # 4. Add the server's host key to known_hosts to bypass confirmation prompt
          ssh-keyscan code.usgs.gov >> ~/.ssh/known_hosts
          
          # 5. Start the SSH agent and load the key into memory 
          eval "$(ssh-agent -s)"
          # *** FIX 1: Load key from STDIN and ignore exit code 1 to proceed ***
          ssh-add -v < ~/.ssh/id_rsa || true
          
          # *** FIX 2: Verify agent has keys loaded (ignore failure) ***
          # This command will now pass even if the key loading failed, allowing the step to complete successfully.
          ssh-add -l || true
        shell: bash
    
      - name: Clone Gitlab Repo via SSH
        run: |
          git clone git@code.usgs.gov:astrogeology/isis-codebuild-ci.git
        shell: bash
    
      - name: Prepare and Push Changes to GitLab Branch
        run: |
          git config --global user.name "Github_CI"
          git config --global user.email "project_14468_bot_3f7d8e1a392afd88ead5f3f3154e809d@noreply.gitlab.com"
          cd isis-codebuild-ci
          git checkout -b PR_$PR_NUMBER
          echo -e "\nenv: \n  shell: bash \n  variables: \n    PR_NUMBER: $PR_NUMBER \n    MERGE_BRANCH: $GITHUB_BASE_REF" >> buildspec.yml
          git commit -a -m "$PR_NUMBER"
          git push origin PR_$PR_NUMBER --force
        shell: bash
          
  comment-bot:
      permissions: write-all
      runs-on: [ubuntu-latest]
      needs: [build]
      steps:
      - name: Check out code
        uses: actions/checkout@v4 
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            The build and test suite have started for your pull request. 
            
            To view your [build log](https://us-west-2.codebuild.aws.amazon.com/project/eyJlbmNyeXB0ZWREYXRhIjoiNDJNZ2MxbHFKTkwxV1RyQUxJekdJY3FIanNqU29rMHB4Nk1YUzk4REIrZUZDeEtEaW9HQlZ1dTZOSHpML2VUTGVDekYydmVFcU9sUHJKN20wQzd1Q0UzSzJscnB0MElDb1M3Ti9GTlJYR1RuMWJTV3V1SkJTa3NoYmc9PSIsIml2UGFyYW1ldGVyU3BlYyI6IjF3U2NTSGlDcEtCc29YVnEiLCJtYXRlcmlhbFNldFNlcmlhbCI6MX0%3D), please reference the build with source version: "PR_${{ github.event.number }}". 
            
            Additionally, check the latest "dev" source version to identify existing test failures. Please note that you are not responsible for the test failures that exist on both your PR and the dev branch.
          

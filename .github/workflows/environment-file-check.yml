name: Environment File Check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-environment-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Determine missing environment/meta files
        id: check
        run: |
          # List of required files
          required_files=("environment.yml" "environment_arm.yml" "environment_arm_linux.yml" "recipe/meta.yml")

          # Get list of changed files from the PR payload
          changed_files=$(jq -r '.pull_request.changed_files as $n | .pull_request.files[]?.filename' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          echo "$changed_files"
          
          # Convert to array
          readarray -t changed_array <<< "$changed_files"

          # Check if any required files were changed
          any_changed=false
          for f in "${required_files[@]}"; do
            for cf in "${changed_array[@]}"; do
              if [[ "$cf" == "$f" ]]; then
                any_changed=true
              fi
            done
          done

          # If none changed, do nothing
          if [ "$any_changed" = false ]; then
            echo "No environment/meta files changed."
            exit 0
          fi

          # Determine missing files
          missing=()
          for f in "${required_files[@]}"; do
            found=false
            for cf in "${changed_array[@]}"; do
              if [[ "$cf" == "$f" ]]; then
                found=true
                break
              fi
            done
            if [ "$found" = false ]; then
              missing+=("$f")
            fi
          done

          # If some required files are missing, set output
          if [ ${#missing[@]} -gt 0 ]; then
            echo "missing_files=${missing[*]}" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR if files are missing
        if: steps.check.outputs.missing_files
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ⚠️ You modified one of the environment/meta files but the following files were not updated: ${{ steps.check.outputs.missing_files }}. Please update them as well.
